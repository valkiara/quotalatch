name: quotalatch
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quotalatch
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget-local-only
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d quotalatch"]
      interval: 2s
      timeout: 3s
      retries: 30

name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.11"
            postgres: "16"
          - python: "3.13"
            postgres: "17"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: quotalatch
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget -d quotalatch"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      BUDGET_DATABASE_URL: postgresql://budget:budget-test-only@127.0.0.1:5432/quotalatch
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
      - name: Run crash demo from the installed wheel
        working-directory: ${{ runner.temp }}
        run: >
          uv run --isolated --no-project --python "${{ matrix.python }}"
          --with "$GITHUB_WORKSPACE"/dist/*.whl
          quotalatch-demo --schema quotalatch_wheel_smoke
      - name: Run crash demo from the installed source distribution
        working-directory: ${{ runner.temp }}
        run: >
          uv run --isolated --no-project --python "${{ matrix.python }}"
          --with "$GITHUB_WORKSPACE"/dist/*.tar.gz
          quotalatch-demo --schema quotalatch_sdist_smoke
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
